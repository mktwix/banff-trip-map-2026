<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Banff Trip Map — Sep 11–20, 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #map { height: 100vh; width: 100%; }
    .leaflet-popup-content { font-size: 13px; line-height: 1.45; max-width: 280px; }
    .leaflet-popup-content h3 { margin: 0 0 6px; font-size: 14px; }
    .leaflet-popup-content p { margin: 4px 0; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #e8f0fe; color: #1a56db; margin-bottom: 6px; }
    .tag.opt { background: #f3f4f6; color: #6b7280; }
    .pin {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff;
      color: #fff; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
    }
    .panel {
      position: absolute; top: 12px; right: 12px; z-index: 1000;
      background: #fff; border-radius: 8px; padding: 12px 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15); max-width: 300px; font-size: 12px;
      max-height: calc(100vh - 24px); overflow-y: auto;
    }
    .panel h1 { margin: 0 0 8px; font-size: 15px; }
    .legend { margin-top: 8px; }
    .legend > div { margin: 3px 0; }
    .legend span { display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
    .legend .dot { width: 10px; height: 10px; border-radius: 50%; }
    @media (max-width: 520px) {
      .panel { left: 12px; right: 12px; max-width: none; top: auto; bottom: 12px; max-height: 42vh; }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="panel">
    <h1>Banff & Calgary Sep 2026</h1>
    <div>22 stops · colored driving routes by day (highway waypoints, not grid lines).</div>
    <div class="legend">
      <div><span class="dot" style="background:#2563eb"></span> Lodging</div>
      <div><span class="dot" style="background:#ca8a04"></span> Activity</div>
      <div><span class="dot" style="background:#64748b"></span> Transport</div>
      <div><span class="dot" style="background:#9ca3af"></span> Optional</div>
      <div style="margin-top:8px;font-weight:600">Route by day</div>
      <div><span style="background:#64748b"></span> Sep 11 travel</div>
      <div><span style="background:#3b82f6"></span> Sep 12 west</div>
      <div><span style="background:#f59e0b"></span> Sep 13 canyon + Radium</div>
      <div><span style="background:#06b6d4"></span> Sep 14 return north</div>
      <div><span style="background:#10b981"></span> Sep 15 lakes</div>
      <div><span style="background:#8b5cf6"></span> Sep 16 light day</div>
      <div><span style="background:#ef4444"></span> Sep 17 Icefields</div>
      <div><span style="background:#9ca3af"></span> Sep 18 optional</div>
      <div><span style="background:#475569"></span> Sep 19 return</div>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const colors = { lodging: "#2563eb", activity: "#ca8a04", transport: "#64748b", optional: "#9ca3af" };

    const stops = [
      { n: 1, id: "yyc-in", name: "YYC arrival", lat: 51.1215, lng: -114.0076, kind: "transport", day: "Sep 11",
        html: "<span class='tag'>Sep 11</span><h3>Calgary YYC arrival</h3><p>Flair lands 18:15 · Turo pick-up 19:00</p>" },
      { n: 2, id: "hampton", name: "Hampton Inn", lat: 51.1351, lng: -114.045, kind: "lodging", day: "Sep 11",
        html: "<span class='tag'>Sep 11 night</span><h3>Hampton Inn Airport North</h3><p>Breakfast incl. · first night</p>" },
      { n: 3, id: "hi-12", name: "HI Banff (12)", lat: 51.195, lng: -115.555, kind: "lodging", day: "Sep 12",
        html: "<span class='tag'>Sep 12</span><h3>HI Banff Alpine Centre</h3><p>Ref 5164644914 · PIN 9709</p>" },
      { n: 4, id: "johnston", name: "Johnston Canyon", lat: 51.2453, lng: -115.84, kind: "activity", day: "Sep 13",
        html: "<span class='tag'>Sep 13 AM</span><h3>Johnston Canyon</h3><p>HI checkout ~11:00 · start early</p>" },
      { n: 5, id: "redstreak", name: "Redstreak A2", lat: 50.6342, lng: -116.0712, kind: "lodging", day: "Sep 13",
        html: "<span class='tag'>Sep 13–14</span><h3>Redstreak oTENTik A2</h3><p>INPC26-59887450B1 · check-in 15:00</p>" },
      { n: 6, id: "radium-springs", name: "Radium Hot Springs", lat: 50.6167, lng: -116.0747, kind: "activity", day: "Sep 13–14",
        html: "<span class='tag'>Sep 13 eve or Sep 14 AM</span><h3>Radium Hot Springs</h3><p>Walk-in · ~2 km trail from Redstreak H Loop · ~$20/adult + pass</p>" },
      { n: 7, id: "hi-14", name: "HI Banff (14)", lat: 51.195, lng: -115.555, kind: "lodging", day: "Sep 14",
        html: "<span class='tag'>Sep 14 night</span><h3>HI Banff Alpine Centre</h3><p>Ref 5825418201 · PIN 8573</p>" },
      { n: 8, id: "moraine", name: "Moraine Lake", lat: 51.3557, lng: -116.1844, kind: "activity", day: "Sep 15",
        html: "<span class='tag'>Sep 15 AM (primary)</span><h3>Moraine Lake shuttle</h3><p>Book Sep 13 10:00 EDT · backup Sep 16 AM (book Sep 14 10:00 EDT)</p>" },
      { n: 9, id: "louise", name: "Lake Louise", lat: 51.4254, lng: -116.1773, kind: "activity", day: "Sep 15",
        html: "<span class='tag'>Sep 15 AM</span><h3>Lake Louise</h3><p>Via Lake Connector from Moraine if time</p>" },
      { n: 10, id: "twojack", name: "Two Jack 52", lat: 51.2108, lng: -115.5608, kind: "lodging", day: "Sep 15",
        html: "<span class='tag'>Sep 15–16</span><h3>Two Jack oTENTik 52</h3><p>INPC26-59538853B1 · check-in 15:00</p>" },
      { n: 11, id: "minnewanka", name: "Lake Minnewanka", lat: 51.2472, lng: -115.5417, kind: "activity", day: "Sep 15–16",
        html: "<span class='tag'>Sep 15 eve or Sep 16 AM</span><h3>Lake Minnewanka</h3><p>~5 min from Two Jack campground</p>" },
      { n: 12, id: "d17", name: "Tunnel Mtn D17", lat: 51.1834, lng: -115.5448, kind: "lodging", day: "Sep 16",
        html: "<span class='tag'>Sep 16–17</span><h3>Tunnel Mountain V2 D17</h3><p>Light day · check-in 15:00 · Moraine backup AM if needed</p>" },
      { n: 13, id: "bow", name: "Bow Lake", lat: 51.7131, lng: -116.4664, kind: "activity", day: "Sep 17",
        html: "<span class='tag'>Sep 17</span><h3>Bow Lake</h3><p>Icefields Parkway stop</p>" },
      { n: 14, id: "peyto", name: "Peyto Lake", lat: 51.7283, lng: -116.5078, kind: "activity", day: "Sep 17",
        html: "<span class='tag'>Sep 17</span><h3>Peyto Lake lookout</h3><p>Icefields Parkway stop</p>" },
      { n: 15, id: "icefield", name: "Columbia Icefield", lat: 52.2203, lng: -117.2242, kind: "activity", day: "Sep 17",
        html: "<span class='tag'>Sep 17</span><h3>Columbia Icefield viewpoints</h3><p>Full day · skip paid Glacier Adventure unless splurge</p>" },
      { n: 16, id: "d5", name: "Tunnel Mtn D5", lat: 51.1826, lng: -115.5485, kind: "lodging", day: "Sep 17",
        html: "<span class='tag'>Sep 17–18</span><h3>Tunnel Mountain V2 D5</h3><p>INPC26-60395520B1 · check-in 15:00</p>" },
      { n: 17, id: "banff-town", name: "Banff town", lat: 51.1784, lng: -115.5708, kind: "optional", day: "Sep 18",
        html: "<span class='tag opt'>Sep 18 optional</span><h3>Banff town · Bow Falls</h3><p>Open afternoon after V2 checkout</p>" },
      { n: 18, id: "vermilion", name: "Vermilion Lakes", lat: 51.1842, lng: -115.5986, kind: "optional", day: "Sep 18",
        html: "<span class='tag opt'>Sep 18 optional</span><h3>Vermilion Lakes</h3><p>Easy sunset walk near Banff</p>" },
      { n: 19, id: "canmore", name: "Canmore", lat: 51.089, lng: -115.3597, kind: "optional", day: "Sep 18",
        html: "<span class='tag opt'>Sep 18 optional</span><h3>Canmore · Grassi Lakes</h3><p>Low-effort afternoon option</p>" },
      { n: 20, id: "upper-springs", name: "Banff Upper Hot Springs", lat: 51.1511, lng: -115.5611, kind: "optional", day: "Sep 18",
        html: "<span class='tag opt'>Sep 18 optional</span><h3>Banff Upper Hot Springs</h3><p>~$20/adult · walk-in</p>" },
      { n: 21, id: "hi-18", name: "HI Banff (18)", lat: 51.195, lng: -115.555, kind: "lodging", day: "Sep 18",
        html: "<span class='tag'>Sep 18 night</span><h3>HI Banff Alpine Centre</h3><p>Ref 5571085239 · PIN 8886</p>" },
      { n: 22, id: "yyc-out", name: "YYC return", lat: 51.1215, lng: -114.0076, kind: "transport", day: "Sep 19",
        html: "<span class='tag'>Sep 19</span><h3>Return YYC</h3><p>Turo 16:00 · flight 00:50 Sep 20</p>" },
    ];

    /** Approximate highway waypoints (Hwy 1 / 93) for long legs — [lat, lng] */
    const via = {
      "hampton|hi-12": [[51.054, -114.38], [51.089, -115.36], [51.162, -115.52]],
      "johnston|redstreak": [[51.18, -115.72], [50.98, -115.88], [50.78, -116.02]],
      "hi-14|moraine": [[51.24, -115.68], [51.32, -116.02]],
      "louise|twojack": [[51.36, -116.08], [51.28, -115.62]],
      "d17|bow": [[51.42, -116.18], [51.58, -116.32]],
      "hi-18|yyc-out": [[51.162, -115.52], [51.089, -115.36], [51.054, -114.38]],
    };

    const routeGroups = [
      { day: "Sep 11", color: "#64748b", weight: 4, dash: null, legs: [["yyc-in", "hampton"]] },
      { day: "Sep 12", color: "#3b82f6", weight: 4, dash: null, legs: [["hampton", "hi-12"]] },
      { day: "Sep 13", color: "#f59e0b", weight: 4, dash: null, legs: [["hi-12", "johnston"], ["johnston", "redstreak"], ["redstreak", "radium-springs"]] },
      { day: "Sep 14", color: "#06b6d4", weight: 4, dash: null, legs: [["redstreak", "hi-14"]] },
      { day: "Sep 15", color: "#10b981", weight: 4, dash: null, legs: [["hi-14", "moraine"], ["moraine", "louise"], ["louise", "twojack"], ["twojack", "minnewanka"]] },
      { day: "Sep 16", color: "#8b5cf6", weight: 4, dash: null, legs: [["minnewanka", "d17"]] },
      { day: "Sep 17", color: "#ef4444", weight: 4, dash: null, legs: [["d17", "bow"], ["bow", "peyto"], ["peyto", "icefield"], ["icefield", "d5"]] },
      { day: "Sep 18", color: "#9ca3af", weight: 3, dash: "8 6", legs: [["d5", "banff-town"], ["d5", "vermilion"], ["d5", "canmore"], ["d5", "upper-springs"], ["banff-town", "hi-18"]] },
      { day: "Sep 19", color: "#475569", weight: 4, dash: null, legs: [["hi-18", "yyc-out"]] },
    ];

    function cellKey(lat, lng) { return lat.toFixed(4) + "," + lng.toFixed(4); }

    function spreadStops(list) {
      const groups = new Map();
      list.forEach((s) => {
        const k = cellKey(s.lat, s.lng);
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(s);
      });
      return list.map((s) => {
        const group = groups.get(cellKey(s.lat, s.lng));
        const idx = group.indexOf(s);
        const total = group.length;
        if (total <= 1) return { ...s, dlat: s.lat, dlng: s.lng };
        const angle = (2 * Math.PI * idx) / total - Math.PI / 2;
        const r = 0.012 + (total > 3 ? 0.006 : 0);
        const cos = Math.cos(s.lat * Math.PI / 180);
        return { ...s, dlat: s.lat + r * Math.cos(angle), dlng: s.lng + (r * Math.sin(angle)) / cos };
      });
    }

    function legKey(fromId, toId) { return `${fromId}|${toId}`; }

    function driveLeg(fromId, toId, byId) {
      const a = byId(fromId);
      const b = byId(toId);
      const start = [a.dlat, a.dlng];
      const end = [b.dlat, b.dlng];
      const key = legKey(fromId, toId);
      const revKey = legKey(toId, fromId);
      const mids = via[key] || (via[revKey] ? [...via[revKey]].reverse() : []);
      return [start, ...mids, end];
    }

    function drawLeg(map, fromId, toId, byId, style) {
      L.polyline(driveLeg(fromId, toId, byId), {
        color: style.color,
        weight: style.weight,
        opacity: 0.85,
        dashArray: style.dash || null,
        lineCap: "round",
        lineJoin: "round",
      }).addTo(map);
    }

    function pinIcon(n, color) {
      return L.divIcon({
        className: "",
        html: `<div class="pin" style="background:${color}">${n}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
      });
    }

    const placed = spreadStops(stops);
    const byId = (id) => placed.find((s) => s.id === id);

    const map = L.map("map").setView([51.45, -115.72], 8);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "© OpenStreetMap contributors",
    }).addTo(map);

    routeGroups.forEach((group) => {
      group.legs.forEach(([fromId, toId]) => {
        drawLeg(map, fromId, toId, byId, group);
      });
    });

    const bounds = [];
    placed.forEach((s) => {
      bounds.push([s.dlat, s.dlng]);
      L.marker([s.dlat, s.dlng], { icon: pinIcon(s.n, colors[s.kind]), zIndexOffset: 1000 - s.n })
        .bindPopup(s.html)
        .bindTooltip(`${s.n}. ${s.name} (${s.day})`, { direction: "top", offset: [0, -12] })
        .addTo(map);
    });
    map.fitBounds(L.latLngBounds(bounds), { padding: [48, 48] });
  </script>
</body>
</html>
